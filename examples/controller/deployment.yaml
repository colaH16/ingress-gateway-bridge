apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-gateway-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress-gateway-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingress-gateway-bridge
    spec:
      serviceAccountName: ingress-gateway-bridge
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          # Replace with the tested image digest before a live installation.
          image: ghcr.io/colah16/ingress-gateway-bridge:feat-controller-bootstrap
          args:
            - --config=/etc/bridge/bridge.yaml
            - --dry-run=true
            - --health-probe-bind-address=:8081
          ports:
            - name: health
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          volumeMounts:
            - name: config
              mountPath: /etc/bridge
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: bridge-config
